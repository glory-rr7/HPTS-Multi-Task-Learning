run:  # 程序运行通用配置

  # 四种模式  训练：train    蒸馏训练：train_distill    测试评估：evaluate    单张图像擦除：predict
  type: predict
  # random seed
  seed: 1  #False 或者 数字，通常来说不使用种子会训练得更快；实验的时候推荐使用一个固定的种子

  # 自定义参数：Custom / Custom3Tags    满血版：Release    轻量化版：Release_lightly     极轻量化版：Release_lightly_extra
  # QAT: Release_quantized
  model: 'Custom'
  # to save models, logs and samples
  data_path: './data'

  # 是否将图像裁剪成小块
  data_crop:
    use: False
    size: 512  # 128的整数倍


custom:  # 使用custom自定义模型的相关参数

  base: 40 #32    # 参数量,默认32，必须是8的倍数，建议16,24,32,40,48,56,64，可参考满血版位64，轻量版32
  refinement: False #True   # 精修复模块，与骨干网络串行的网络模块，占用额外显存较小，但会增加耗时
  ffp: False #True   # 细化特征模块，与骨干网络并行的网络模块，占用额外显存较大，额外耗时较小
  ppm: False #True   # 在最深处使用金字塔池化模块，可以捕捉大范围的图像特征
  down_sample: 0.5  # 下采样倍数，默认1表示不进行下采样，建议0.5或者0.75

  # 注意力机制包含 ca,cbam,ela,eca,se,sa,null
  am: ela # 注意力机制模块；设为 null 时下采样部分不嵌入注意力机制


distill:  # 仅 run.type=train_distill 时生效
  teacher_model: 'Release'
  student_model: 'Release_lightly_extra'
  teacher_model_path: './data/train/Release_mixed98_20250909_v0/models/60.pth'

  # 当 teacher_model 或 student_model 为 Custom 时，可分别提供独立参数
  # teacher_custom:
  #   base: 64
  #   refinement: True
  #   ffp: True
  #   ppm: True
  #   down_sample: 1.0
  #   am: ela
  # student_custom:
  #   base: 32
  #   refinement: False
  #   ffp: False
  #   ppm: False
  #   down_sample: 0.5
  #   am: ela

  # 学生模型是否先加载初始化权重（可选）
  student_pretrained:
    use: False
    model_path: './data/train/Release_lightly_extra_init/models/0.pth'

  # Deep监督位置固定为ppm_post：
  # - Release: ppm输出
  # - Release_lightly/Release_lightly_extra/Custom: down4输出
  deep_feature_tap: ppm_post

  # deep对齐方法：l2 | at
  deep_method: l2

  # 损失权重，默认 task:deep:output:mm = 1:1:1:1
  loss_weights:
    task: 1.0
    deep: 1.0
    output: 1.0
    mm: 1.0

  # deep_method=l2 时生效：teacher侧 Conv1x1(Ct->Cs)
  adapter:
    teacher_conv1x1:
      trainable: True

srpdg:
  lambda: 50.0  # SRPDG attention consistency loss 权重；主项目任务损失较大，需要放大该正则项

train:
  # 多任务梯度方法：baseline / balance / pcgrad / balance_pcgrad
  gradient_method: baseline
  gradient_balance:
    min_weight: 0.1
    max_weight: 10.0
    ema_beta: 0.9
    eps: 1.0e-12
  aug: True  # 数据增强开关：在 dataset 中以 60% 概率触发一次增强，并在5种方法中等概率选择1种；不再使用旧的 crop/scale 增强
  strategy: none  # 训练策略：none / srpdg / coral；启用策略时由训练循环接管成对增强

  pretrained:  # 使用预训练模型
    use: True
#    model_path: './data/train/Release_threetags_20250719_v0/models/200.pth'
    model_path: "/home/luzhixian/HTR_Release_2_DL/data/train/Pretrained40/models/100.pth"

  epochs: 200  #训练批次
  model_save_every: 5  # 模型保存间隔，做实验的时候间隔调适中，方便断点继续训练；应用场景下，间隔调小一点，精确使用效果最好的模型
  sample_save_every: 1  # 样本保存间隔，默认1就行
  learning_rate: 0.00002 # 学习率,别调太大，通常小于0.001
  batch_size: 24       # 批次大小，因为有用到batch normal，所以建议不要把batch size设置成1，会报错
  numberworks: 12        # 线程数，需要预处理的图像可能会比较耗时，线程数可以开大点，单张显卡对应4-8个线程是符合经验的选择
  dataset_path:
    #- '/home/luzhixian/bak/datasets/truedata/train'
    #    - '/home/luzhixian/bak/datasets/synth_data2'
#    - '/home/luzhixian/bak/datasets/coarse'
# - '/home/luzhixian/bak/datasets/synth_data'
     - '/home/luzhixian/bak/datasets/v2.2-REAL/train'
#    - '/home/luzhixian/bak/datasets/threetags/direct'
#    - '/home/luzhixian/bak/datasets/threetags/baidu/baidu'
  #path: "./dataset/threetags"

  mult_stage_loss:      # 多阶段损失，开启多阶段损失后，会在设定批次之后开始专注于输出模块的性能，忽略过程中其他模块的性能
    use: False         # 是否使用多阶段损失，做实验的时候推荐不要用，微调模型的时候可以用
    epoch: 2            # 多阶段损失开始训练的批次

  # 第一阶段：梯度冲突诊断。只读取梯度，不改变原有反向传播和参数更新。
  gradient_diagnostics:
    enabled: True
    interval: 10       # 每隔多少个 batch 记录一次；设为 1 可记录所有 batch
    filename: 'gradient_diagnostics.csv'

validation:             # 验证集配置，训练的每一个批次训练完成之后，会验证一次模型，也就是在模型没有见过的模型上简单测试一下性能
  dataset_path: '/home/luzhixian/bak/datasets/v2.2-REAL/val'
  batch_size: 8
  numberworks: 4

predict:                # 单张擦除图像
  # model_path: '../HTR_Release/data/train/Release_mixed98_20250909_v0/models/60.pth'
  model_path: "./checkpoints/finetune_40.pth"
  input_file_path: "checkpoints/cis_bmp_20250606_122008.png" #"./datasets/HTR-test/HTR-A001-20260114-uncer-incomplete/bszn/3/base.jpg"

evaluate:               # 测试评估，评估模型性能，只有批次为1的时候可以计算ssim，否则只能计算psnr
  model_path: './data/train/Release_threetags_20250719_v0/models/200.pth'
  batch_size: 1
  numberworks: 1
  dataset_path: './datasets/truedata/test'
